name: Build debug APK

# Convenience only (spec §3.1): the project MUST remain buildable fully offline with
# `./gradlew assembleDebug` on a developer machine. This workflow exists because the sandbox
# used for day-to-day development cannot JIT-compile (PRoot blocks mprotect(PROT_EXEC)), which
# makes local Gradle builds correct but very slow. CI is never a hard dependency.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship a pre-installed Android SDK (ANDROID_HOME already set,
      # includes recent platforms/build-tools). android-actions/setup-android is unmaintained
      # and was observed to hang indefinitely in this project — do not reintroduce it.
      - name: Install required SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ime-core unit tests
        run: ./gradlew :ime-core:test --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify no arm64 libs and no androidx.compose deps in :app / :ui-wear (spec §8.0, §3 item 2)
        run: |
          ./gradlew :app:dependencies :ui-wear:dependencies --configuration releaseRuntimeClasspath > /tmp/deps.txt || true
          if grep -qi "androidx.compose" /tmp/deps.txt; then
            echo "::error::androidx.compose.* dependency leaked into :app or :ui-wear (spec §8.0 forbids this)"
            exit 1
          fi

      - name: Verify APK contains no native libraries (spec §3 item 2 — 32-bit ABI trap)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if unzip -l "$APK" | grep -q "lib/"; then
            echo "::error::APK contains native libraries — this project is pure Kotlin/JVM by design"
            unzip -l "$APK" | grep "lib/"
            exit 1
          fi

      - name: Verify no INTERNET / RECORD_AUDIO permission (spec §3 items 3 and 5)
        run: |
          MANIFEST=app/src/main/AndroidManifest.xml
          for PERM in "android.permission.INTERNET" "android.permission.RECORD_AUDIO"; do
            if grep -q "$PERM" "$MANIFEST"; then
              echo "::error::$PERM appears in the manifest — forbidden by the project's offline/touch-only guarantees"
              exit 1
            fi
          done

      - name: Verify no keystroke logging in key-handling paths (spec §11.5 security)
        run: |
          if grep -rnE "Log\.[dviwe]\(" app/src/main ui-wear/src/main ime-core/src/main; then
            echo "::error::logging call found in keyboard source — a keyboard must never log keystrokes"
            exit 1
          fi

      - name: Report APK size (budget: 15 MB, spec §3 item 4)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BYTES=$(stat -c%s "$APK")
          echo "APK size: $BYTES bytes ($((BYTES / 1024)) KB)"
          if [ "$BYTES" -gt 15728640 ]; then
            echo "::error::APK exceeds the 15 MB budget"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
