name: Build debug APK

# Convenience only (spec §3.1): the project MUST remain buildable fully offline with
# `./gradlew assembleDebug` on a developer machine. This workflow exists because the sandbox
# used for day-to-day development cannot JIT-compile (PRoot blocks mprotect(PROT_EXEC)), which
# makes local Gradle builds correct but very slow. CI is never a hard dependency.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship a pre-installed Android SDK (ANDROID_HOME already set,
      # includes recent platforms/build-tools). android-actions/setup-android is unmaintained
      # and was observed to hang indefinitely in this project — do not reintroduce it.
      - name: Install required SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :ime-core:test :dict:test :layout-engine:test :engine-swipe:test :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify no arm64 libs and no androidx.compose deps in :app / :ui-wear (spec §8.0, §3 item 2)
        run: |
          ./gradlew :app:dependencies :ui-wear:dependencies --configuration releaseRuntimeClasspath > /tmp/deps.txt || true
          if grep -qi "androidx.compose" /tmp/deps.txt; then
            echo "::error::androidx.compose.* dependency leaked into :app or :ui-wear (spec §8.0 forbids this)"
            exit 1
          fi

      - name: Verify APK contains no native libraries (spec §3 item 2 — 32-bit ABI trap)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if unzip -l "$APK" | grep -q "lib/"; then
            echo "::error::APK contains native libraries — this project is pure Kotlin/JVM by design"
            unzip -l "$APK" | grep "lib/"
            exit 1
          fi

      - name: Verify no INTERNET / RECORD_AUDIO permission (spec §3 items 3 and 5)
        # Checks the BUILT manifest inside the APK, which is what actually ships, rather than
        # grepping the source file — the source contains comments explaining why these
        # permissions are absent, and matching those would be a false positive.
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          PERMS=$("$ANDROID_HOME/build-tools/36.1.0/aapt2" dump permissions "$APK" || true)
          echo "$PERMS"
          for PERM in "android.permission.INTERNET" "android.permission.RECORD_AUDIO"; do
            if echo "$PERMS" | grep -q "name='$PERM'"; then
              echo "::error::$PERM is declared in the shipped APK — forbidden by the project's offline/touch-only guarantees"
              exit 1
            fi
          done

      - name: Verify no keystroke logging in key-handling paths (spec §11.5 security)
        # Matches android.util.Log calls and println in .kt sources only. Comment lines are
        # excluded so documentation about this rule doesn't trip the rule.
        run: |
          HITS=$(grep -rnE "(android\.util\.Log|[^a-zA-Z]Log\.[dviwe]\(|println\()" \
                   --include="*.kt" app/src/main ui-wear/src/main ime-core/src/main \
                 | grep -vE "^\s*[^:]+:[0-9]+:\s*(//|\*|/\*)" || true)
          if [ -n "$HITS" ]; then
            echo "::error::logging call found in keyboard source — a keyboard must never log keystrokes"
            echo "$HITS"
            exit 1
          fi

      - name: Report APK size against the 15 MB budget (spec §3 item 4)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BYTES=$(stat -c%s "$APK")
          echo "APK size: $BYTES bytes ($((BYTES / 1024)) KB)"
          if [ "$BYTES" -gt 15728640 ]; then
            echo "::error::APK exceeds the 15 MB budget"
            exit 1
          fi

      - name: Verify dictionary word lists and indexes agree (spec §4.2 heap budget)
        run: |
          # The 8 MB java-heap gate (spec §14) is set by the number of words in the index. A
          # revision that shipped 30 000 words instead of the budgeted 10 000 measured 39.8 MB of
          # Dalvik heap on the watch and nothing in CI noticed, hence this gate.
          FAIL=0
          for f in dictionaries/*.txt; do
            LINES=$(wc -l < "$f")
            echo "$f: $LINES words"
            if [ "$LINES" -gt 10000 ]; then
              echo "::error::$f has $LINES words; the measured heap budget allows 10000"
              FAIL=1
            fi
            # Every entry must carry a tab-separated frequency. Without it each word ends up
            # equally weighted and candidate ranking silently becomes arbitrary — a quality
            # regression no build error would ever surface.
            MISSING=$(grep -cv "$(printf '\t')" "$f" || true)
            if [ "$MISSING" -ne 0 ]; then
              echo "::error::$f has $MISSING entries with no frequency column"
              FAIL=1
            fi
          done

          # The committed .bin indexes must be exactly what the committed .txt lists compile to.
          # If they drift, the app ships a dictionary nobody reviewed.
          python3 tools/build_index.py dictionaries/en.txt /tmp/en.bin
          python3 tools/build_index.py dictionaries/ru.txt /tmp/ru.bin
          for lang in en ru; do
            if ! cmp -s "/tmp/$lang.bin" "app/src/main/assets/dictionaries/$lang.bin"; then
              echo "::error::app/src/main/assets/dictionaries/$lang.bin is stale — rerun tools/build_index.py"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ]

      - name: Verify dictionary indexes are stored uncompressed so they can be mapped
        run: |
          # A compressed asset cannot be memory-mapped: AssetManager only returns a file
          # descriptor for stored entries. If these ever become deflated, the loader falls back to
          # extraction and the heap saving silently disappears.
          APK=app/build/outputs/apk/debug/app-debug.apk
          FAIL=0
          for lang in en ru; do
            ENTRY="assets/dictionaries/$lang.bin"
            # Match the entry line by name rather than by row number, and read the method from the
            # field that literally says Stored/Defl:N — column positions in `unzip -lv` shift with
            # the width of the size values.
            METHOD=$(unzip -lv "$APK" "$ENTRY" | awk -v e="$ENTRY" '$NF == e {
              for (i = 1; i <= NF; i++) if ($i == "Stored" || $i ~ /^Defl/) { print $i; exit }
            }')
            echo "$lang.bin storage method: ${METHOD:-unknown}"
            if [ "$METHOD" != "Stored" ]; then
              echo "::error::$ENTRY is '${METHOD:-unknown}', must be Stored — a compressed asset cannot be mmap'd (see noCompress in app/build.gradle.kts)"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ]

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
