name: Release APK

# Publishes a downloadable APK to GitHub Releases so people can install WearKey without
# building it (spec §13: "GitHub only" distribution — no store, no account, no fee).
#
# Trigger either by pushing a version tag:
#     git tag v0.1.0 && git push origin v0.1.0
# or manually from the Actions tab (workflow_dispatch) with a version string.
#
# SIGNING: if the repository has the RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD /
# RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD secrets set, a signed release APK is produced.
# Without them the workflow still publishes a debug-signed APK, clearly labelled as such, so
# the project always has a downloadable build. Note that swapping between debug-signed and
# release-signed builds requires users to uninstall first (signature mismatch).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :ime-core:test --no-daemon

      - name: Decode signing keystore (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing keystore configured — publishing a debug-signed APK."
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.present == 'true'
        env:
          WEARKEY_KEYSTORE: ${{ runner.temp }}/release.jks
          WEARKEY_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          WEARKEY_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          WEARKEY_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Build debug APK (unsigned-release fallback)
        if: steps.keystore.outputs.present != 'true'
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Stage APK and checksum
        id: stage
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.value }}"
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            SRC=app/build/outputs/apk/release/app-release.apk
            NAME="wearkey-${VERSION}.apk"
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
            NAME="wearkey-${VERSION}-debug.apk"
          fi
          cp "$SRC" "dist/$NAME"
          cd dist
          sha256sum "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "--- published files ---"
          ls -la

      # A signed-but-wrong-key APK is indistinguishable from a correct one until users cannot
      # upgrade. The fingerprint is public - it ships inside every APK - so pinning it here leaks
      # nothing and turns that silent failure into a build error.
      - name: Verify signing certificate is the expected one
        if: steps.keystore.outputs.present == 'true'
        env:
          EXPECTED: "53:08:BA:BB:6D:04:D4:B7:3D:8A:05:91:B0:E7:9B:C4:5A:3E:7C:28:40:FF:6A:39:DC:A7:83:96:5D:35:20:EB"
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "dist/${{ steps.stage.outputs.name }}" \
            | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}')
          # apksigner prints the digest without colons; normalise the expected value to match.
          NORM=$(echo "$EXPECTED" | tr -d ':' | tr 'A-Z' 'a-z')
          echo "expected: $NORM"
          echo "actual:   $ACTUAL"
          if [ "$ACTUAL" != "$NORM" ]; then
            echo "::error::release APK signed with an unexpected certificate"
            exit 1
          fi

      - name: Verify release APK has no native libs
        run: |
          if unzip -l "dist/${{ steps.stage.outputs.name }}" | grep -q "lib/"; then
            echo "::error::release APK contains native libraries"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: WearKey ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            dist/${{ steps.stage.outputs.name }}
            dist/${{ steps.stage.outputs.name }}.sha256
          body: |
            ## WearKey ${{ steps.version.outputs.value }}

            A free, fully offline keyboard for Wear OS. No account, no tiers, no telemetry,
            no network permission, no microphone.

            > **Upgrading from v0.1.0?** That release was debug-signed, before the project had a
            > release key. This build is signed properly, so Android will refuse to install it
            > over the old one. Uninstall first — `adb uninstall dev.darsma.wearkey` — then
            > install this APK. This is a one-time step; future updates install normally.

            ### Install

            Download the APK below and side-load it:

            ```sh
            adb connect <watch-ip>:<port>
            adb install -r wearkey-*.apk
            adb shell ime enable dev.darsma.wearkey/.WearKeyImeService
            adb shell ime set    dev.darsma.wearkey/.WearKeyImeService
            ```

            No computer? The same two `ime` commands work through Shizuku on the watch.

            Verify your download against the published `.sha256` file.

            ### Requirements

            Wear OS 3 or newer (API 30+). Tested on the OnePlus Watch 2 (Wear OS 4, API 34).

            ---

            Licence: Apache-2.0. Source, privacy statement and third-party notices are in the
            repository.
