name: Bug report
description: Tell me about something that is broken or behaves unexpectedly
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please leave out passwords, messages, clipboard contents and any other private text.
  - type: input
    id: watch
    attributes:
      label: Watch model and Wear OS version
      placeholder: "e.g. OnePlus Watch 2, Wear OS 4"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App or reply surface
      placeholder: "e.g. browser URL field, notification reply"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
