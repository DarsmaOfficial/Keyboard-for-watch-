name: Feature request
description: Suggest an improvement to typing or setup on the watch
title: "idea: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        WearKey is an offline, touch-only keyboard. Suggestions that need a server, account, microphone, paid service or GPL/AGPL code will not fit the project.
  - type: textarea
    id: problem
    attributes:
      label: What watch-typing problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Does it need any new permission or dependency?
      description: "List it here and explain why it is needed."
    validations:
      required: true
