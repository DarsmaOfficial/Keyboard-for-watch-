org.gradle.jvmargs=-Xint -Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# PRoot sandbox disallows executable memory pages -> JVM must run interpreted (-Xint above).
# Daemon reuse still helps avoid repeated JVM startup cost.
org.gradle.daemon=true
org.gradle.parallel=false
