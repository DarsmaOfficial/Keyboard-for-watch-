org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.daemon=true
org.gradle.parallel=false

# NOTE for local sandbox builds only (PRoot blocks mprotect(PROT_EXEC), so the JVM cannot JIT):
# set JAVA_TOOL_OPTIONS=-Xint and GRADLE_OPTS=-Xint as environment variables before invoking
# gradle/gradlew locally — do NOT put -Xint here, it would also force CI's real JIT-capable
# runner into interpreted mode and made a trivial CI build take 14+ minutes with zero progress
# before this was diagnosed and fixed.
